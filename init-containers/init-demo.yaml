apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  initContainers:
    - name: create-homepage
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "The init container prepared this page." > /work-dir/index.html
      volumeMounts:
        - name: shared-data
          mountPath: /work-dir

  containers:
    - name: web-server
      image: nginx:1.27
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html

  volumes:
    - name: shared-data
      emptyDir: {}