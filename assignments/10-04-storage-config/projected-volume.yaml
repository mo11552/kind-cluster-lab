apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
  namespace: storage-lab
data:
  app.properties: |
    environment=training
    log_level=info

---
apiVersion: v1
kind: Secret
metadata:
  name: application-secret
  namespace: storage-lab
type: Opaque
stringData:
  username: training-user
  password: practice-password

---
apiVersion: v1
kind: Pod
metadata:
  name: projected-volume-pod
  namespace: storage-lab
  labels:
    app: projected-demo
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: combined-data
          mountPath: /projected
          readOnly: true

  volumes:
    - name: combined-data
      projected:
        sources:
          - configMap:
              name: application-config
              items:
                - key: app.properties
                  path: config/app.properties

          - secret:
              name: application-secret
              items:
                - key: username
                  path: secret/username
                - key: password
                  path: secret/password

          - downwardAPI:
              items:
                - path: pod/name
                  fieldRef:
                    fieldPath: metadata.name
                - path: pod/namespace
                  fieldRef:
                    fieldPath: metadata.namespace
                - path: pod/labels
                  fieldRef:
                    fieldPath: metadata.labels