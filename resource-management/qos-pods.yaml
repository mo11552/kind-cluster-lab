apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-pod
  labels:
    qos-demo: guaranteed
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"

---
apiVersion: v1
kind: Pod
metadata:
  name: burstable-pod
  labels:
    qos-demo: burstable
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

---
apiVersion: v1
kind: Pod
metadata:
  name: besteffort-pod
  labels:
    qos-demo: besteffort
spec:
  containers:
    - name: nginx
      image: nginx:1.27